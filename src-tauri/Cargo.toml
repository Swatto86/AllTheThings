[package]
name = "allthethings"
version = "0.5.0"
description = "A voidtools Everything clone — instant filename search via the NTFS MFT"
authors = ["Swatto <claude.ai@swatto.co.uk>"]
license = "MIT"
repository = "https://github.com/Swatto86/AllTheThings"
homepage = "https://github.com/Swatto86/AllTheThings"
readme = "../README.md"
edition = "2021"
rust-version = "1.95"

[lib]
name = "allthethings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
bincode = "1.3"
png = "0.17"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
