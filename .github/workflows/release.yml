name: Release

# Builds the Windows installer and attaches it to a GitHub release.
#
# Trigger by publishing a release (GitHub UI or `gh release create vX.Y.Z
# --generate-notes`) for a tag like v0.1.0 — the installer is built and
# uploaded to that release. `workflow_dispatch` lets you rebuild/re-attach to
# an existing release manually.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installer to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned to match rust-toolchain.toml at the repo root.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build

      - name: Attach installer + updater manifest to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer was produced" }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No .sig produced — updater signing is not configured" }

          $version = $env:TAG.TrimStart("v")
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$($exe.Name)"
          $manifest = [ordered]@{
            version   = $version
            notes     = "See https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigPath -Raw).Trim()
                url       = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 latest.json

          Write-Host "Uploading installer, signature and latest.json to $env:TAG"
          gh release upload $env:TAG $exe.FullName $sigPath latest.json --clobber --repo $env:GITHUB_REPOSITORY
